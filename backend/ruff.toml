line-length = 88          # black default

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = ["E501"]         # line-length enforced by formatter, not linter

[lint.isort]
known-first-party = ["app"]